<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 750" role="img" aria-labelledby="title desc">
  <title id="title">APATE operation architecture</title>
  <desc id="desc">The operator uses the Flask interface to design an operation and run plugins. Plugins publish events to the EventBus. The bus feeds the rule engine and telemetry. Telemetry is stored in SQLite and used by reporting.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#28414a" stroke-width="1" opacity=".45"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6aa4a8"/></marker>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#bafc61"/></marker>
    <style>
      .node { fill: #1d3037; stroke: #66828a; stroke-width: 2; }
      .node-accent { fill: #243626; stroke: #bafc61; stroke-width: 2; }
      .heading { fill: #f1f3ee; font: 700 24px Arial, sans-serif; }
      .sub { fill: #bccbd0; font: 17px Arial, sans-serif; }
      .kicker { fill: #bafc61; font: 700 17px monospace; letter-spacing: 2px; }
      .label { fill: #bbcdd0; font: 16px monospace; }
      .route { fill: none; stroke: #6aa4a8; stroke-width: 3; marker-end: url(#arrow); }
      .route-lime { fill: none; stroke: #bafc61; stroke-width: 3; marker-end: url(#arrow-lime); }
    </style>
  </defs>
  <rect width="1440" height="750" fill="#102129"/>
  <rect width="1440" height="750" fill="url(#grid)"/>
  <text x="48" y="62" class="kicker">APATE / OPERATION ARCHITECTURE</text>
  <path class="route" d="M215 372H268"/>
  <path class="route" d="M440 372H498"/>
  <path class="route" d="M685 372H743"/>
  <path class="route" d="M915 372H973"/>
  <path class="route" d="M1165 372H1218"/>
  <path class="route" d="M355 329V209"/>
  <path class="route-lime" d="M830 329V265H625V209"/>
  <path class="route-lime" d="M625 209V276H595V329"/>
  <path class="route" d="M1095 553V415"/>
  <text x="229" y="354" class="label">HTTP</text>
  <text x="686" y="354" class="label">PluginEvent</text>
  <text x="932" y="354" class="label">events</text>

  <rect x="45" y="330" width="170" height="85" rx="12" class="node-accent"/>
  <text x="65" y="365" class="heading">Operator</text><text x="65" y="390" class="sub">browser</text>
  <rect x="270" y="330" width="170" height="85" rx="12" class="node"/>
  <text x="290" y="365" class="heading">Flask UI</text><text x="290" y="390" class="sub">apate.web</text>
  <rect x="500" y="330" width="185" height="85" rx="12" class="node"/>
  <text x="520" y="365" class="heading">Plugins</text><text x="520" y="390" class="sub">decoys and actions</text>
  <rect x="745" y="330" width="170" height="85" rx="12" class="node"/>
  <text x="765" y="365" class="heading">EventBus</text><text x="765" y="390" class="sub">synchronous</text>
  <rect x="975" y="330" width="190" height="85" rx="12" class="node"/>
  <text x="995" y="365" class="heading">Telemetry</text><text x="995" y="390" class="sub">events and IoCs</text>
  <rect x="1220" y="330" width="165" height="85" rx="12" class="node"/>
  <text x="1240" y="365" class="heading">SQLite</text><text x="1240" y="390" class="sub">telemetry.db</text>

  <rect x="270" y="125" width="200" height="85" rx="12" class="node"/>
  <text x="290" y="160" class="heading">Operation</text><text x="290" y="185" class="sub">profile · RoE · plans</text>
  <rect x="520" y="125" width="205" height="85" rx="12" class="node-accent"/>
  <text x="540" y="160" class="heading">RuleEngine</text><text x="540" y="185" class="sub">deterministic · RoE</text>
  <rect x="1000" y="555" width="200" height="85" rx="12" class="node"/>
  <text x="1020" y="590" class="heading">Report</text><text x="1020" y="615" class="sub">expected / observed</text>
  <text x="47" y="690" class="label">Source: APATE repository · English adaptation of the Archify diagram</text>
</svg>
